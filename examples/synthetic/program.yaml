    goal: G1
    kind: 질적
    formula: "완료 과제의 후속개발 착수까지 평균 개월 수"
    unit: 개월
    data_source: "후보풀 관리 대장"
    baseline: {year: null, value: null, source: ""}
    targets: {2029: null, 2030: null, 2031: null}
    target_basis: ""
    target_source: ""
    external_factors: ""
    weight: null

context:
  external_conditions: "수요 대기업의 공급망 재편 일정과 해외 경쟁 소재의 가격"
  concurrent_programs: "소재부품기술개발사업(예시부)"

sources:
  - id: D1
    title: "예시 사업설명자료"
    date: "2026-09"
notes: "합성 예시. 모든 수치·문장은 지어낸 것이며 실존 사업과 무관하다."
