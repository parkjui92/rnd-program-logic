# 실제 공개 사업 — 나노융합2020사업(과기정통부·산업부 공동, 2012~2020, 종료)
# 입력은 전부 KISTEP 「나노융합2020사업」 특정평가 보고서(2019-10, 2019년도 1차 특정평가 19-3) 원문에서 옮겼다(sources.md).
# 평가 보고서는 사업설명자료가 아니라 사업을 '서술'한 문서라서, 투입→활동→산출→결과의 '그래서' 문장(because)은
# 보고서에 명시된 곳만 적고 나머지는 비웠다. 비운 곳이 도구가 보고하는 '끊김'이며, 그것이 이 예시의 내용이다.
name: 나노융합2020사업
agency: 과학기술정보통신부 융합기술과 / 산업통상자원부 바이오나노과
period:
  start: 2012
  end: 2020
  type: 기한
budget_total:
  value: 1431.5
  unit: 억원
  source: "특정평가 보고서 p.3 (연도별 합계 143,145백만원)"
program_type: 성과확산
program_type_basis: "[추정] 보고서 p.3 사업목적 '기존 나노원천기술 연구개발의 성과를 조기에 사업화' — 안내서 Ⅲ.2 '사업목적이 기술사업화인 사업'. 보고서에 사업유형 명시 없음"
lifecycle: 장기

strategic_goal:
  text: "나노융합기술 기반 개발 결과의 사업화 실현 또는 권리보호가 가능한 기술적 성과 달성(패키지형 핵심·회피·보완·공백 특허 확보) / 사업화를 통한 경제적 성과 달성 / 지속가능한 나노융합기술 조기 상용화 체계 구축"
  source: "특정평가 보고서 p.3 (전략목표 3개를 한 줄로)"
performance_goals:
  - id: G1
    text: "글로벌 스타상품 개발 4건"
    source: "특정평가 보고서 p.3"
  - id: G2
    text: "신시장·신산업 창출형 융합원천기술 40건"
    source: "특정평가 보고서 p.3"
  - id: G3
    text: "사업화 성공기업 15개"
    source: "특정평가 보고서 p.3"
  - id: G4
    text: "세계적 나노융합 핵심기술 4건"
    source: "특정평가 보고서 p.3"

sub_programs: [우수 연구성과 상용화, 현안해결 나노기술 매칭]

chain:
  inputs:
    - id: I1
      text: "총사업비 1,431.5억원(2012~2020)"
      source: "특정평가 보고서 p.3"
    - id: I2
      text: "연구재단·산기평·나노융합공공연구기관협의회 등이 보유한 연구성과(나노기술 특허)"
      source: "특정평가 보고서 p.3, p.19"
    - id: I3
      text: "(재)나노융합2020사업단(운영관리규정으로 설립)"
      source: "특정평가 보고서 요약 x"
  activities:
    - id: A1
      text: "우수 연구성과 상용화 지원(특허기술 사업화, 3년 이내)"
      uses: [I1, I2, I3]
      sub_program: 우수 연구성과 상용화
      source: "특정평가 보고서 p.3"
    - id: A2
      text: "현안해결 나노기술 매칭(나노기업 현안해결 지원, 1년 이내)"
      uses: [I1, I3]
      sub_program: 현안해결 나노기술 매칭
      source: "특정평가 보고서 p.3"
    - id: A3
      text: "연구성과가 기업에 공개되도록 기술교류회 발표 유도·개최, 사업단 홈페이지 공개"
      uses: [I3]
      source: "특정평가 보고서 p.3"
  outputs:
    - id: O1
      text: "사업화가 완성된 제품(사업화 성공 제품)"
      from: [A1]
      source: "특정평가 보고서 <표 3-10> 사업화성공(제품) 지표 정의"
    - id: O2
      text: "등록특허(SMART 등급으로 질 측정)"
      from: [A1]
      source: "특정평가 보고서 <표 3-10>"
    - id: O3
      text: "상용화 지원 건(IP 컨설팅 지원 + 산업계 현안해결 지원)"
      from: [A2]
      source: "특정평가 보고서 <표 3-10> 상용화지원건수 산식"
  outcomes_short:
    - id: S1
      text: "사업화 성공기업(종료 전후 매출 발생 기업)"
      from: [O1]
      because: "과제 성공 여부와 무관하게 종료시점 전·후로 매출액이 발생한 '사업화 성공기업'(보고서 p.38 정의)"
      source: "특정평가 보고서 p.38"
    - id: S2
      text: "사업화 매출액(기여율 반영)"
      from: [O1]
      because: ""
      source: "특정평가 보고서 <표 3-10>"
  outcomes_long:
    - id: L1
      text: "글로벌 스타상품(주력산업 주요 제품 또는 핵심 기능 부품)"
      from: [S1]
      goal: G1
      because: ""
      source: "특정평가 보고서 p.38 정의"
    - id: L2
      text: "세계적 나노융합 핵심기술(스타상품 핵심 기능과 직접 연관된 특허화 기술)"
      from: [S1]
      goal: G4
      because: ""
      source: "특정평가 보고서 p.38 정의"
    - id: L3
      text: "나노융합원천기술(산업적 실현 또는 권리보호가 가능한 패키지형 기술)"
      from: [S1]
      goal: G2
      because: ""
      source: "특정평가 보고서 p.38 정의"

indicators:
  - id: K1
    name: SMART 반영 특허
    stage: 산출
    measures: O2
    goal: G4
    kind: 질적
    formula: "{(등록×0.6×SMART가중치)+(출원×0.4)} / 지원예산(10억원당)"
    unit: 건/10억원
    data_source: "[확인 필요] 보고서 <표 3-10>에 자료원 열 없음"
    baseline: {year: 2013, value: 0.67, source: "<표 3-10> '2개년 평균 특허 실적 0.67건'"}
    targets: {2014: 0.87, 2015: 0.96}
    target_basis: "'14년: 2개년 평균 특허 실적 0.67건 대비 30% 상향 / '15년: 전년도 실적 및 추세 감안 10% 상향"
    target_source: "특정평가 보고서 <표 3-10> 목표치 산출 근거 열"
    external_factors: ""
    weight: 0.4
  - id: K2
    name: 사업화성공(제품)
    stage: 산출
    measures: O1
    goal: G3
    kind: 양적
    formula: "사업수행의 결과로 사업화가 완성된 제품의 건수(거래자료/제품사양 등 확인)"
    unit: 개
    data_source: "거래자료·제품사양"
    baseline: {year: null, value: null, source: ""}
    targets: {2014: 2, 2015: 3}
    target_basis: "전년도 실적(건) 및 추세감안 100% 설정(종료과제 대비 사업화 달성 30%로 설정)"
    target_source: "특정평가 보고서 <표 3-10>"
    external_factors: ""
    weight: 0.5
  - id: K3
    name: 상용화체계구축
    stage: 산출
    measures: O3
    goal: G3
    kind: 양적
    formula: "∑[(나노원천기술 발굴 및 산업계 기술지원)×0.9 + (현안해결 나노기술 매칭지원)×0.1]"
    unit: 건
    data_source: "[확인 필요]"
    baseline: {year: null, value: null, source: ""}
    targets: {2014: 1.3, 2015: 1.8}
    target_basis: "'14년: 전년도 실적 및 추세 감안 대비 10% 이상 상향 / '15년: 50% 이상 상향"
    target_source: "특정평가 보고서 <표 3-10>"
    external_factors: ""
    weight: 0.1
  - id: K4
    name: 매출액
    stage: 결과
    measures: S2
    goal: G3
    kind: 질적
    formula: "∑[(a매출액)×기여율 + (b매출액)×기여율 + … (n매출액)×기여율]"
    unit: 억원
    data_source: "[확인 필요]"
    baseline: {year: null, value: null, source: ""}
    targets: {2016: 300}
    target_basis: "총 투입금액(계획대비 30% 지원) 대비 매출 200%"
    target_source: "특정평가 보고서 <표 3-10>"
    external_factors: "기여율 반영(산식). 평가원 권고: 동 사업의 직접적인 수혜금액 반영 필요(요약 xii)"
    weight: 0.5
  - id: K5
    name: 등록특허 SMART 등급점수
    stage: 산출
    measures: O2
    goal: G4
    kind: 질적
    formula: "∑등록특허의 SMART 등급값 / 등록특허건수"
    unit: 점
    data_source: "[확인 필요]"
    baseline: {year: 2015, value: 4.78, source: "<표 3-10> '최근 2년('14~'15) 실적치의 평균값(4.78)'"}
    targets: {2016: 4.83, 2017: 4.88, 2018: 4.93}
    target_basis: "최근 2년('14~'15) 실적치의 평균값(4.78)에 연평균 증가율 1%를 적용하여 설정"
    target_source: "특정평가 보고서 <표 3-10>"
    external_factors: ""
    weight: 0.3
  - id: K6
    name: 사업화매출액
    stage: 결과
    measures: S2
    goal: G3
    kind: 질적
    formula: "∑[n(매출액×기여율)]"
    unit: 억원
    data_source: "[확인 필요]"
    baseline: {year: 2015, value: null, source: "'직전년도('15년) 실적치' — 값은 표에 없음"}
    targets: {2016: 986, 2017: 1183, 2018: 1420}
    target_basis: "직전년도('15년) 실적치에 연평균 증가율 20% 적용"
    target_source: "특정평가 보고서 <표 3-10>"
    external_factors: "기여율 반영(산식). 1개 기업이 전체 사업화 매출액의 62%(보고서 p.39)"
    weight: 0.5
  - id: K7
    name: 상용화지원건수
    stage: 산출
    measures: O3
    goal: G3
    kind: 양적
    formula: "① IP 컨설팅 지원 건수 + ② 산업계 현안해결 지원 건수"
    unit: 건
    data_source: "[확인 필요]"
    baseline: {year: null, value: null, source: ""}
    targets: {2016: 2, 2017: 5, 2018: 5}
    target_basis: "'16년: 참여기업의 수요가 급감하여 목표치를 2건으로 제시 / '17~'18년: 5건으로 상향 조정"
    target_source: "특정평가 보고서 <표 3-10>"
    external_factors: ""
    target_lowered_for_low_performance: false   # '수요 급감'이 실적 저조와 같은 것인지 표만으로는 판단 불가 → false 로 두고 확인 필요에 적음
    weight: 0.2

context:
  external_conditions: "나노기술은 특정 산업으로 분류되기보다 여러 제조업에 횡적으로 가치를 기여하는(Cross-enabling) 기술(보고서 p.18). 예타 사업비 5,130억원이 1,431.5억원으로 축소 집행(요약 ix)"
  concurrent_programs: "나노융합산업핵심기술개발(산업부), 나노·소재기술개발(과기정통부), 사업화연계기술개발(산업부) — 보고서 <표 3-11> 비교대상 사업"

sources:
  - id: D1
    title: "한국과학기술기획평가원, 「나노융합2020사업」 특정평가 보고서(2019년도 1차 국가연구개발사업 특정평가보고서 19-3)"
    date: "2019-10"
notes: "종료된 사업의 사후 재구성. 성과목표 4건의 목표치는 보고서 p.3에 있으나 '설정 근거'는 보고서에 없어 지표표의 근거 열은 <표 3-10>의 연차 목표치 근거만 적었다. K7 의 2016년 목표치 하향(2→5건의 앞 단계) 사유 '참여기업 수요 급감'이 안내서 Ⅴ.6 '낮은 실적으로 인한 변경'에 해당하는지는 표만으로 판단할 수 없어 [확인 필요]."
